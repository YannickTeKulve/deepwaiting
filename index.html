<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepWaiting</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Accumulating chaos lives here, behind the calm centre. Non-interactive. -->
    <div id="chaos" aria-hidden="true"></div>

    <main>
      <!-- Start screen (browsers require a user gesture before audio plays) -->
      <section id="start" class="screen">
        <h1 class="brand">DeepWaiting</h1>
        <p class="tagline">Mindfulness for developers waiting on AI.</p>
        <button id="begin" class="begin">Begin</button>
        <p class="sound-hint">🔊 Turn your sound on</p>
        <a
          class="github-link"
          href="https://github.com/YannickTeKulve/deepwaiting/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View source on GitHub"
        >
          <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
        </a>
      </section>

      <!-- Player: the calm "eye of the storm" — breathing circle + current line -->
      <section id="player" class="screen hidden">
        <div id="breathing" class="breathing hidden" aria-hidden="true"></div>
        <p id="stage" class="stage"></p>

        <div class="progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>
    </main>

    <!-- Finale: everything fades to white, one blinking cursor remains -->
    <section id="finale" class="finale hidden" aria-hidden="true">
      <p class="finale-cursor">Thinking<span class="dots"></span></p>
      <p id="eta" class="eta hidden">Estimated completion time:<br />2 minutes.</p>
      <button id="replay" class="replay hidden">Replay</button>
      <a
        class="github-link"
        href="https://github.com/YannickTeKulve/deepwaiting/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
      </a>
    </section>

    <audio id="audio" preload="auto"></audio>
    <script src="chaos.js"></script>
    <script src="app.js"></script>
  </body>
</html>
